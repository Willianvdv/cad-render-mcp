name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: OpenCascade
        run: brew install opencascade
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release
      - name: Demo fixture is reproducible
        run: |
          ./target/release/cad-render-mcp demo-step /tmp/demo.step
          ./target/release/cad-render-mcp bench /tmp/demo.step || true
      - name: End-to-end over MCP stdio (GPU checks skip when the runner has no Metal device)
        run: python3 tests/e2e_demo.py --out e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-images
          path: e2e-out
