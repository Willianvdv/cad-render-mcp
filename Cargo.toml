[package]
name = "cad-render-mcp"
version = "0.1.0"
edition = "2024"
description = "Let Claude open your CAD files (STEP, IGES, BREP), look at them from every angle, measure them and make photos and videos of them, through MCP."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cad", "opencascade", "step", "mcp", "render"]
categories = ["graphics", "rendering"]

[dependencies]
anyhow = "1"
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
exr = "1"
gif = "0.14"
glam = { version = "0.34", features = ["bytemuck"] }
libc = "0.2"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-video", "objc2-core-media"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFBase"] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelBufferPool"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray"] }
png = "0.18"
pollster = "1.0"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs"] }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
zune-jpeg = "0.5"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 4
