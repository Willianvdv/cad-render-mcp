[package]
name = "shapeshot"
version = "0.1.0"
edition = "2024"
description = "Headless, GPU-accelerated OpenCascade (STEP/BREP/IGES) renderer and geometry inspector that speaks only MCP."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cad", "opencascade", "step", "mcp", "render"]
categories = ["graphics", "rendering"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
libc = "0.2"
png = "0.18"
pollster = "0.4"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs"] }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 4
